name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pyyaml pytest
      - run: python -m pytest tests/ -q

  rules:
    # The tool run against its own rule set. If ruleproof cannot keep its own
    # detections green, the rest of the repository is a brochure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pyyaml
      - name: every rule passes its tests, and none are untested
        run: python -m ruleproof.cli test rules
      - name: ATT&CK coverage report
        run: python -m ruleproof.cli coverage rules
      - name: coverage against techniques actually observed in the wild
        # Not a vanity number: this fails the build if coverage of real observed
        # activity regresses. The sample is a snapshot of what the threat-intel
        # pipeline saw, so the threshold is deliberately just under the current
        # figure -- it catches a rule being deleted or narrowed into uselessness.
        run: python -m ruleproof.cli gap rules samples/observed-techniques.txt --fail-under 38
      - name: ...and against the subset the source did not flag as inference
        # Half the sightings in the sample above come from notes whose own author
        # marked them as going beyond their source. Gating only the looser number
        # would let coverage of the *evidenced* subset rot unnoticed, which is the
        # half that should actually drive which rule gets written next.
        run: python -m ruleproof.cli gap rules samples/observed-techniques-confirmed.txt --fail-under 48
      - name: test suites actually discriminate (mutation check)
        run: python scripts/mutation_check.py

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: python -m ruff check ruleproof/ tests/ scripts/
