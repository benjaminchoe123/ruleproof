true_positives:
  - name: esentutl copying Chrome's password database out from under the lock
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\esentutl.exe'
      CommandLine: 'esentutl.exe /y "C:\Users\bob\AppData\Local\Google\Chrome\User Data\Default\Login Data" /d C:\Users\bob\AppData\Local\Temp\ld.db /o'
  - name: cmd copying Login Data to a staging directory
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\cmd.exe'
      CommandLine: 'cmd.exe /c copy "C:\Users\bob\AppData\Local\Microsoft\Edge\User Data\Default\Login Data" %TEMP%\d.tmp'
  - name: PowerShell taking the Firefox key database
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      CommandLine: 'powershell -nop -w hidden Copy-Item C:\Users\bob\AppData\Roaming\Mozilla\Firefox\Profiles\a1b2.default\key4.db $env:TEMP'
  - name: robocopy pulling the Firefox saved-logins file
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\robocopy.exe'
      CommandLine: 'robocopy C:\Users\bob\AppData\Roaming\Mozilla\Firefox\Profiles\a1b2.default C:\Users\Public /if logins.json'
  - name: xcopy taking Chrome's autofill and payment-card store
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\xcopy.exe'
      CommandLine: 'xcopy /y "C:\Users\bob\AppData\Local\Google\Chrome\User Data\Default\Web Data" C:\ProgramData\'
  - name: pwsh, the cross-platform shell, doing the same thing
    event:
      EventID: 4688
      Image: 'C:\Program Files\PowerShell\7\pwsh.exe'
      CommandLine: 'pwsh -c Copy-Item "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login Data" C:\Users\Public\x'

true_negatives:
  # Every constraint is guarded by a case that only that constraint rejects.
  - name: Chrome itself opening its own credential store
    event:
      EventID: 4688
      Image: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
      CommandLine: '"C:\Program Files\Google\Chrome\Application\chrome.exe" --profile-directory=Default --restore-last-session "C:\Users\bob\AppData\Local\Google\Chrome\User Data\Default\Login Data"'
  - name: a profile-migration tool naming robocopy as its transport
    event:
      EventID: 4688
      Image: 'C:\Program Files\Corp\ProfileMigrator\migrate.exe'
      CommandLine: 'migrate.exe --tool=robocopy --path "C:\Users\bob\AppData\Local\Google\Chrome\User Data\Default\Login Data" --dest \corp\profiles\bob'
  - name: esentutl doing ordinary ESE database work on the Windows Search index
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\esentutl.exe'
      CommandLine: 'esentutl.exe /r edb /l C:\ProgramData\Microsoft\Search\Data\Applications\Windows'
  - name: PowerShell reading a file that merely starts with the word Login
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      CommandLine: 'powershell -c Get-Content C:\Users\bob\AppData\Local\Corp\LoginHistory.txt'
  - name: cmd copying an ordinary user document
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\cmd.exe'
      CommandLine: 'cmd.exe /c copy C:\Users\bob\Documents\budget.xlsx C:\Users\bob\OneDrive\'
  - name: not a process-creation event
    event:
      EventID: 4624
      Image: 'C:\Windows\System32\esentutl.exe'
      CommandLine: 'esentutl.exe /y "C:\Users\bob\AppData\Local\Google\Chrome\User Data\Default\Login Data" /d C:\Users\bob\AppData\Local\Temp\ld.db /o'
