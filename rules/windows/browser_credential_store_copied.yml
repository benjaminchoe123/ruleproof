title: Browser Credential Store Copied by Another Process
id: 3f7a91e4-52cd-4b18-9e06-8c4d1a7b5e20
status: experimental
description: >
  Detects a copy or database utility reading a browser's saved-password store —
  Chrome and Edge's `Login Data`, Firefox's `key4.db` and `logins.json`, or
  Chrome's `Web Data` autofill and payment-card store. The browser reads these
  files constantly; nothing else has a routine reason to, and an infostealer's
  first act after execution is usually to take a copy.

  `esentutl /y` earns its place at the front of the list: Chrome holds `Login
  Data` open, so a plain copy fails, and esentutl is the signed Windows binary
  that will read a locked database anyway. That is the technique's actual shape
  on disk, and it is why matching on the file rather than on the tool would miss
  the interesting half.

  Three conditions hold together: the event is a process creation, the executing
  image is a copy or database utility, and its command line names a browser
  credential store. Each is guarded by a near-miss negative — Chrome opening its
  own store, a profile-migration tool that merely names robocopy, esentutl doing
  ordinary Windows Search maintenance, a file called `LoginHistory.txt`.

  Written because `ruleproof gap` ranked T1555.003 the highest-observed
  undetected technique that is neither product-shaped nor invisible to this rule
  set's telemetry — see the README on why T1190, T1068 and T1056.001 are left
  alone for three different reasons.
references:
  - https://attack.mitre.org/techniques/T1555/003/
  - https://lolbas-project.github.io/lolbas/Binaries/Esentutl/
author: Benjamin Choe
date: 2026-08-27
logsource:
  product: windows
  category: process_creation
detection:
  selection_tool:
    EventID: 4688
    Image|endswith:
      - '\esentutl.exe'
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\robocopy.exe'
      - '\xcopy.exe'
  selection_store:
    CommandLine|contains:
      - '\Login Data'
      - '\Web Data'
      - 'key4.db'
      - 'logins.json'
  condition: selection_tool and selection_store
falsepositives:
  - >
    Profile migration and user-state transfer tools, which legitimately copy
    browser profiles wholesale. This is the main source of noise and it is real;
    the tuning is to allowlist the specific migration binary or its signing
    certificate, not to drop the credential-store paths — a negative for exactly
    this case is in the test suite.
  - >
    Endpoint backup agents that shell out to robocopy or xcopy over a whole user
    profile. Worth knowing about regardless: a backup that captures `Login Data`
    is a backup that captures credentials.
  - Forensic and IR tooling collecting browser artifacts during an investigation
level: high
tags:
  - attack.credential_access
  - attack.t1555.003
