true_positives:
  - name: task launching a binary from AppData
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\schtasks.exe'
      CommandLine: 'schtasks /create /sc minute /mo 10 /tn Updater /tr C:\Users\alice\AppData\Roaming\svc.exe'
  - name: task launching from the public profile
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\schtasks.exe'
      CommandLine: 'schtasks /Create /TN Sync /TR "C:\Users\Public\sync.vbs" /SC ONLOGON'

true_negatives:
  - name: task pointing at a signed binary in System32
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\schtasks.exe'
      CommandLine: 'schtasks /create /tn Defrag /tr C:\Windows\System32\defrag.exe /sc weekly'
  - name: querying tasks rather than creating one
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\schtasks.exe'
      CommandLine: 'schtasks /query /fo LIST'
  # Guards `selection`: it satisfies the user-writable-path condition and fails
  # only on the verb, so loosening the ' /create' discriminator fails here. The
  # case this replaced meant to do exactly that and did not -- its command line
  # said 'AppDataTask', which contains no '\AppData\', so it broke both
  # conditions and guarded neither. Same shape as the mutation that survived on
  # 2026-08-26: a constraint protected by a test that asserted nothing about it.
  - name: repointing an existing task at a user-profile binary, not creating one
    event:
      EventID: 4688
      Image: 'C:\Windows\System32\schtasks.exe'
      CommandLine: 'schtasks /change /tn CorpUpdater /tr "C:\Users\bob\AppData\Local\Corp\updater.exe"'
