  - name: ordinary HTTPS
    event:
      DestinationIp: '140.82.121.4'
      DestinationPort: 443
      Image: 'C:\Program Files\Git\bin\git.exe'
  - name: ordinary HTTP-alt on 8080, which the same week's data also carried C2 on
    event:
      DestinationIp: '203.0.113.10'
      DestinationPort: 8080
      Image: 'C:\Program Files\Mozilla Firefox\firefox.exe'
  - name: TrueConf on its own service port 4307, which is legitimate by design
    event:
      DestinationIp: '198.51.100.20'
      DestinationPort: 4307
      Image: 'C:\Program Files\TrueConf\Client\TrueConf.exe'
  - name: an ephemeral high port that is not on the list
    event:
      DestinationIp: '203.0.113.55'
      DestinationPort: 49232
      Image: 'C:\Windows\System32\svchost.exe'
  - name: internal RFC1918 destination on a listed port
    event:
      DestinationIp: '10.4.2.9'
      DestinationPort: 8808
      Image: 'C:\Program Files\Internal\agent.exe'
  - name: internal 172.16 destination on a listed port
    event:
      DestinationIp: '172.16.8.3'
